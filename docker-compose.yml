version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/RetailDashboard.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    # Uncomment when using Postgres
    # depends_on:
    #   - db
    
  web:
    build:
      context: .
      dockerfile: src/RetailDashboard.Web/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiUrl=http://api:8080
    depends_on:
      - api

  # Commented out Postgres DB for future use
