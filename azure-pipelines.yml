trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  quayRegistry: 'quay.io'
  quayRepositoryApi: 'devnations-ceaca/retail-api'
  quayRepositoryWeb: 'devnations-ceaca/retail-web'
  tag: '$(Build.BuildId)'

steps:
- task: UseDotNet@2
  displayName: 'Use .NET 8.0 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'


- task: Docker@2
  displayName: 'Build Api Container'
  inputs:
    command: build
    repository: '$(quayRegistry)/$(quayRepositoryApi)'
    dockerfile: 'src/RetailDashboard.Api/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)'
    tags: |
      $(tag)

- task: Docker@2
  displayName: 'Build Web Container'
  inputs:
    command: build
    repository: '$(quayRegistry)/$(quayRepositoryWeb)'
    dockerfile: 'src/RetailDashboard.Web/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)'
    tags: |
      $(tag)

- task: Docker@2
  displayName: 'Login to Quay.io'
  inputs:
    command: login
    containerRegistry: 'QuayServiceConnection' # This needs to be configured in Azure DevOps

- task: Docker@2
  displayName: 'Push Api Container to Quay.io'
  inputs:
    command: push
    repository: '$(quayRepositoryApi)'
    tags: |
      $(tag)

- task: Docker@2
  displayName: 'Push Web Container to Quay.io'
  inputs:
    command: push
    repository: '$(quayRepositoryWeb)'
    tags: |
      $(tag)

# --- GitOps: Update deployment manifests with new image tag ---
- script: |
    git clone https://$(GitHubPAT)@github.com/zapata13/RetailDashboardGitops.git
  displayName: 'Clone GitOps Repository'

- script: |
    cd RetailDashboardGitops
    sed -i "s|image: $(quayRegistry)/$(quayRepositoryApi):.*|image: $(quayRegistry)/$(quayRepositoryApi):$(tag)|g" base/retail-api/deployment.yaml
    sed -i "s|image: $(quayRegistry)/$(quayRepositoryWeb):.*|image: $(quayRegistry)/$(quayRepositoryWeb):$(tag)|g" base/retail-web/deployment.yaml
    echo "Updated deployment files to tag: $(tag)"
    cat base/retail-api/deployment.yaml | grep "image:"
    cat base/retail-web/deployment.yaml | grep "image:"
  displayName: 'Update Image Tags in Deployments'

- script: |
    cd RetailDashboardGitops
    git config user.email "zapata@redhat.com"
    git config user.name "Eduardo Zapata"
    git add -A
    git commit -m "Update image tag to $(tag)"
    git push
  displayName: 'Commit and Push to GitOps Repo'
